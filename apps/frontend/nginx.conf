# Static bundle only. The GUI talks to the backend directly at VITE_BACKEND_URL, which the
# backend's CORS allowlist has to include — nothing is proxied here, so nothing in this file
# needs to know the backend exists.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames, so these are safe to cache hard. index.html deliberately is not
    # in here: it is what points at the hashed names, and a cached copy pins an old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
